services:
  greenmail:
    image: greenmail/standalone:2.1.11
    ports:
      - '3025:3025'
      - '3143:3143'
      - '8080:8080'
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=ledger:sydekyks@local.test
        -Dgreenmail.preload.dir=/greenmail/preload
        -Dgreenmail.verbose
    healthcheck:
      test: ['CMD', 'bash', '-c', '</dev/tcp/127.0.0.1/3143']
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ./tests/fixtures/greenmail:/greenmail/preload:ro
