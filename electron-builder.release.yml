extends: ./electron-builder.yml
forceCodeSigning: true
publish:
  provider: generic
  url: ${env.SYDEKYKS_UPDATE_URL}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  notarize: true
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
